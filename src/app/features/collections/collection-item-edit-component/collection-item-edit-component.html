<div class="item-detail">

  <!-- ======================================================
        APERÇU : CollectionItemCard (<app-collection-item-card>)
        En Angular : <app-collection-item-card [item]="collectionItem()" />
        ====================================================== -->
  <div class="preview">
    <article class="collection-item-card">
      <span class="rarity-chip">Legendary</span>

      <figure class="item-image">
        <!-- Illustration inline : figurine Linx -->
        <svg viewBox="0 0 120 150" role="img" aria-label="Figurine Linx">
          <!-- Socle -->
          <ellipse cx="60" cy="141" rx="30" ry="7" fill="#3f2f22" opacity="0.3"/>
          <ellipse cx="60" cy="136" rx="29" ry="8" fill="#5b4330"/>
          <ellipse cx="60" cy="133" rx="29" ry="8" fill="#7a5c41"/>

          <!-- Jambes -->
          <rect x="48" y="104" width="9" height="26" rx="4" fill="#3c5d86"/>
          <rect x="63" y="104" width="9" height="26" rx="4" fill="#3c5d86"/>
          <path d="M46 127 h13 v6 a3 3 0 0 1 -3 3 h-10 z" fill="#5a3b22"/>
          <path d="M62 127 h13 v6 a3 3 0 0 1 -3 3 h-10 z" fill="#5a3b22"/>

          <!-- Tunique -->
          <path d="M44 70 q16 -8 32 0 l4 30 q-20 7 -40 0 z" fill="#2f6fa8"/>
          <path d="M44 70 q16 -8 32 0 l1 8 q-17 -6 -34 0 z" fill="#3f81bd"/>

          <!-- Ceinture -->
          <rect x="44" y="98" width="32" height="6" fill="#6b4423"/>
          <rect x="57" y="97" width="8" height="8" rx="1.5" fill="#d9b45a"/>

          <!-- Bras gauche levé (épée) -->
          <path d="M47 74 q-8 6 -11 14 l7 5 q4 -9 10 -12 z" fill="#2f6fa8"/>
          <circle cx="38" cy="93" r="4.2" fill="#f0bd92"/>

          <!-- Bras droit (bouclier) -->
          <path d="M75 74 q9 6 11 14 l-7 5 q-4 -9 -10 -12 z" fill="#2f6fa8"/>
          <circle cx="83" cy="93" r="4.2" fill="#f0bd92"/>

          <!-- Tête -->
          <circle cx="60" cy="55" r="12.5" fill="#f2c49b"/>
          <path d="M47 54 q0 -14 13 -14 q13 0 13 14 q-4 -6 -13 -6 q-9 0 -13 6 z" fill="#7a4a24"/>
          <path d="M47 54 q-2 -3 0 -6 q1 4 3 5 z" fill="#7a4a24"/>
          <circle cx="55" cy="56" r="1.3" fill="#33261c"/>
          <circle cx="65" cy="56" r="1.3" fill="#33261c"/>
          <path d="M56 61 q4 3 8 0" fill="none" stroke="#a5643c" stroke-width="1.2" stroke-linecap="round"/>

          <!-- Épée -->
          <path d="M40 91 L31 44 L36 41 L45 89 Z" fill="#d8dde4" stroke="#9aa1aa" stroke-width="1"/>
          <path d="M33 46 L35.5 42 L38 45 Z" fill="#f4f6f8"/>
          <rect x="33" y="88" width="14" height="4" rx="2" fill="#b8873f" transform="rotate(8 40 90)"/>
          <rect x="37" y="92" width="4" height="9" rx="2" fill="#6b4423" transform="rotate(8 39 96)"/>

          <!-- Bouclier -->
          <circle cx="86" cy="92" r="15" fill="#8a5a2b" stroke="#5d3b1c" stroke-width="2"/>
          <circle cx="86" cy="92" r="11" fill="none" stroke="#c9a15a" stroke-width="1.5"/>
          <path d="M86 80 v24 M74 92 h24" stroke="#6b4423" stroke-width="1.2" opacity="0.7"/>
          <circle cx="86" cy="92" r="4" fill="#d9b45a" stroke="#6b4423" stroke-width="1"/>
        </svg>
      </figure>

      <header class="item-header">
        <h2 class="item-name">Linx</h2>
      </header>

      <p class="item-description">A legendary sword of unmatched sharpness and history.</p>

      <footer>
        <p class="item-price">250 €</p>
      </footer>
    </article>
  </div>

  <app-item-edit-form-component></app-item-edit-form-component>

</div>
