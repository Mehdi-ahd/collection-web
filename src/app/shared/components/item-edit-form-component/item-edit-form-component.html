<!-- ======================================================
        FORMULAIRE D'ÉDITION
        En Angular :
          <form [formGroup]="itemFormGroup" (submit)="submit($event)">
        ====================================================== -->
<form class="item-form" action="collection-detail.html" method="get">

  <!-- Champ : Name -->
  <div class="form-field">
    <div class="control">
      <label for="name">Name : *</label>
      <input id="name" name="name" type="text" value="Linx" required>
    </div>
    <!-- Zone dynamique Angular : @if (isFieldValid('name')) { <mat-error>This field is required!</mat-error> } -->
  </div>

  <!-- Champ : Description -->
  <div class="form-field">
    <div class="control">
      <label for="description">Description : *</label>
      <textarea id="description" name="description" rows="5" required>A legendary sword of unmatched sharpness and history.</textarea>
    </div>
    <!-- Zone dynamique Angular : @if (isFieldValid('description')) { <mat-error>This field is required!</mat-error> } -->
  </div>

  <!-- Champ : Rarity -->
  <div class="form-field">
    <div class="control">
      <label for="rarity">Rarity*</label>
      <select id="rarity" name="rarity" required>
        <option value="Legendary" selected>Legendary</option>
        <option value="Rare">Rare</option>
        <option value="Uncommon">Uncommon</option>
        <option value="Common">Common</option>
      </select>
    </div>
    <!-- Zone dynamique Angular : @if (isFieldValid('rarity')) { <mat-error>This field is required!</mat-error> } -->
  </div>

  <!-- Champ : Price -->
  <div class="form-field">
    <div class="control">
      <label for="price">Price : *</label>
      <input id="price" name="price" type="number" min="0" value="250" required>
    </div>
    <!-- Zone dynamique Angular : @if (isFieldValid('price')) { <mat-error>...</mat-error> } -->
  </div>

  <!-- Champ : Image (upload) -->
  <input id="image" name="image" type="file" accept="image/*" hidden>
  <label class="upload-button" for="image">Upload Image: ...</label>
  <!-- Zone dynamique Angular : @if (isFieldValid('image')) { <div class="error">This field is required.</div> } -->

  <!-- Barre d'actions -->
  <div class="action-buttons">
    <div class="left">
      <!--
        En Angular, ce bouton n'est affiché qu'en mode édition :
        @if (itemId()) { <button ...>Delete</button> }
      -->
      <a class="btn btn-danger" href="collection-detail.html">Delete</a>
    </div>
    <div class="right">
      <!-- En Angular : (click)="navigateBack()" -->
      <a class="btn btn-text" href="collection-detail.html">Cancel</a>
      <!-- En Angular : [disabled]="itemFormGroup.invalid" -->
      <button class="btn btn-filled" type="submit">Save</button>
    </div>
  </div>

</form>
